        <fieldset id="mtp-options"><legend>MTP options</legend>
          <div class="field-grid advanced-grid">
            <div><label for="draft_tokens">Max draft tokens</label><input id="draft_tokens" name="draft_tokens" type="number" min="1" max="7" step="1" required></div>
            <div data-mtp-controller><label for="mtp_policy">Draft policy</label><select id="mtp_policy" name="mtp_policy"><option value="length">Length (default)</option><option value="survival">Survival</option></select></div>
            <div data-mtp-controller><label for="mtp_draft_vocab">Draft vocabulary</label><select id="mtp_draft_vocab" name="mtp_draft_vocab"><option value="full">Full (default)</option><option value="latin">Latin / code</option></select></div>
          </div>
          <label class="check-label" data-mtp-controller><input id="prompt_lookup" name="prompt_lookup" type="checkbox"> Prompt lookup</label>
          <p class="hint" data-mtp-controller>Flash-Next controllers: survival and prompt lookup target single-session decoding. Latin vocabulary is intended for English/code and may slow drafting in other languages.</p>
        </fieldset>
